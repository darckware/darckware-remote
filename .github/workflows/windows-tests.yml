name: windows-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run tests
        shell: powershell
        run: Invoke-Pester tests -CI -Output Detailed
      - name: Scan tracked files for Tailscale credentials
        shell: powershell
        run: |
          $matches = @(git grep -n -E 'tskey-(auth|client)-[A-Za-z0-9_-]{10,}' -- . ':(exclude)docs/superpowers/plans/*')
          if ($matches.Count -gt 0) { $matches | Write-Error; exit 1 }
